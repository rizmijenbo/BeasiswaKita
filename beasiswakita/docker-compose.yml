name: beasiswakita

services:
  # PHP-FPM 8.3 + Composer (menjalankan Laravel)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    container_name: beasiswakita-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - beasiswakita
    depends_on:
      db:
        condition: service_healthy

  # Nginx sebagai web server (http://localhost:8000)
  webserver:
    image: nginx:1.27-alpine
    container_name: beasiswakita-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - beasiswakita
    depends_on:
      - app

  # MySQL 8.0
  db:
    image: mysql:8.0
    container_name: beasiswakita-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-beasiswakita}
      MYSQL_USER: ${DB_USERNAME:-beasiswa}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      TZ: Asia/Jakarta
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - beasiswakita
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # phpMyAdmin (http://localhost:8080)
  phpmyadmin:
    image: phpmyadmin:5
    container_name: beasiswakita-pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8080}:80"
    networks:
      - beasiswakita
    depends_on:
      db:
        condition: service_healthy

networks:
  beasiswakita:
    driver: bridge

volumes:
  dbdata:
